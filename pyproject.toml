[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minidungeons-mcts"
version = "0.1.0"
description = "Deterministic MiniDungeons 2 backend and MCTS research environment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
minidungeons-random = "minidungeons.cli.random_agent:main"
minidungeons-mcts = "minidungeons.cli.mcts_experiment:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["minidungeons*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
