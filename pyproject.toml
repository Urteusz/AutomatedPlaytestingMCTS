[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minidungeons-mcts"
version = "0.1.0"
description = "Deterministic MiniDungeons 2 backend and MCTS research environment"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

# Funkcjonalne extras - czesc publicznego kontraktu pakietu.
# Instalowane przez uzytkownika, gdy chce danej funkcji: pip install "minidungeons-mcts[gui]"
[project.optional-dependencies]
gui = ["pygame-ce>=2.5,<3"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[project.scripts]
minidungeons-random = "minidungeons.cli.random_agent:main"
minidungeons-mcts = "minidungeons.cli.mcts_experiment:main"
minidungeons-play = "minidungeons.frontend.game_loop:main"
minidungeons-heatmap = "minidungeons.frontend.heatmap:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["minidungeons*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort - kolejnosc importow
    "UP",       # pyupgrade
    "B",        # bugbear
    "TID",      # tidy-imports - pilnuje kierunku zaleznosci miedzy warstwami
    "RUF",
]

[tool.ruff.lint.flake8-tidy-imports]
# Import relatywny tylko w obrebie wlasnej warstwy (from .engine import ...).
# Siegniecie do warstwy wyzej (from ..domain import ...) musi byc absolutne.
ban-relative-imports = "parents"

[tool.ruff.lint.isort]
known-first-party = ["minidungeons"]
